schemaVersion: 1
id: requirements
enabled: true
promptFile: ./prompts/requirements.md
skills:
  - ./skills/requirements/product-requirements/SKILL.md
tools:
  - requirements.context
  - requirements.saveDraft
  - requirements.dispatch
  - ask_user
  - skills.read
  - read
  - write
  - edit
  - ls
  - grep
  - find
  - chatroom.send
  - chatroom.read
  - chatroom.work
  - chatroom.trace
  - chatroom.delivery
mcp: []
knowledge:
  homeBinding: requirements
  sharedReadBindings: []
limits:
  maxRunningSessions: 1
  maxToolOutputChars: 24000
# model 与 workspace 是本机相关字段：由用户层 ~/.pi-webx/agents/requirements.yaml 提供，仓库默认不设。
